# =============================================================================
# nginx-icm.conf — Proxy inverso TLS para Infra Credentials Manager
#
# El backend hapi escucha en 127.0.0.1:8743 y sirve TANTO la API (/api/*) como
# la SPA compilada (frontend/dist, vía @hapi/inert). nginx no sirve estáticos:
# solo termina TLS y reenvía todo. Un único origen, sin CORS entre partes.
#
# Instalación (Debian/Ubuntu):
#   sudo cp nginx-icm.conf /etc/nginx/sites-available/icm
#   sudo ln -s /etc/nginx/sites-available/icm /etc/nginx/sites-enabled/icm
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANTE — pareja obligatoria con backend/.env:
#   TRUST_PROXY=1        (este archivo añade UN salto; sin esto la app ve a
#                         todos los usuarios como 127.0.0.1 y el rate limiting
#                         de /api/auth —10 intentos/15 min— los bloquea a todos
#                         de golpe, además de arruinar la auditoría)
#   HTTPS_ENABLED=true   (activa el flag Secure de la cookie de sesión y
#                         upgrade-insecure-requests en la CSP)
#   CORS_ORIGIN=https://icm.empresa.com
# =============================================================================

# --- Redirección de HTTP a HTTPS --------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name icm.empresa.com;

    # Ruta de renovación de Let's Encrypt (debe seguir en HTTP).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Servidor TLS ------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name icm.empresa.com;

    ssl_certificate     /etc/letsencrypt/live/icm.empresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icm.empresa.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling (requiere ssl_trusted_certificate).
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/icm.empresa.com/chain.pem;

    # -------------------------------------------------------------------------
    # NO añadir add_header de seguridad aquí.
    #
    # El backend ya emite CSP, HSTS, X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, COOP y CORP desde src/plugins/securityHeaders.js, y las
    # aplica tanto a la API como a los estáticos. Duplicarlas hace que el
    # navegador reciba dos cabeceras: en el caso de CSP las dos políticas se
    # INTERSECAN (gana la más estricta) y la SPA se rompe sin error visible.
    #
    # Si algún día se quiere endurecer la CSP, se hace en securityHeaders.js.
    # -------------------------------------------------------------------------

    # Ocultar la versión de nginx en cabeceras y páginas de error.
    server_tokens off;

    # Las credenciales viajan en el cuerpo de peticiones pequeñas; no hay
    # subida de archivos. Un límite bajo reduce superficie de abuso.
    client_max_body_size 1m;

    access_log /var/log/nginx/icm.access.log;
    error_log  /var/log/nginx/icm.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8743;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # CLAVE: $proxy_add_x_forwarded_for AÑADE $remote_addr a la cadena
        # existente en vez de sobrescribirla. Es lo que lee clientIp.js para
        # resolver la IP real con TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;

        # La rotación de Master Key re-cifra todas las credenciales en una sola
        # sentencia y puede tardar. Margen amplio para no cortarla a media
        # transacción.
        proxy_read_timeout    300s;
    }
}
